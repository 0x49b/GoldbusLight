name: Delete all artifacts

on:
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * 0" # Sundays 03:00 UTC, remove if not needed

permissions:
  actions: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Delete artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          ids=$(gh api --paginate "repos/$REPO/actions/artifacts?per_page=100" --jq '.artifacts[].id')
          count=0
          for id in $ids; do
            gh api -X DELETE "repos/$REPO/actions/artifacts/$id" && count=$((count+1))
          done
          echo "Deleted $count artifacts"
