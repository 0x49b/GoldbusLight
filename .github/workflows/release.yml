# Production binaries + GitHub Release.
# - linux-amd64: native build on ubuntu-latest (CGO + GTK/WebKit from apt).
# - linux-arm64: native build on ubuntu-24.04-arm (Raspberry Pi OS 64-bit / arm64 Linux).
# - windows-amd64, darwin-amd64, darwin-arm64: OS runners.
# Binaries are unsigned (no macOS notarization / Windows Authenticode in CI).

name: Release Build

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to publish (must exist on the remote), e.g. v1.0.0"
        required: true
        type: string

concurrency:
  group: release-${{ github.event.inputs.tag || github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  pages: write
  id-token: write

env:
  GO_VERSION: "1.26.x"
  NODE_VERSION: "24.15.0"
  WAILS_VERSION: "v3.0.0-alpha2.108"

jobs:
  build-linux-amd64:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - name: Install Linux GUI build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config \
            libgtk-4-dev libwebkitgtk-6.0-dev libglib2.0-dev libsoup-3.0-dev
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: ${{ env.GO_VERSION }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: arduino/setup-task@c0bc642852239c2689f73f4ea6459c29405f3c52 # v3.0.0
        with:
          version: 3.x
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Add Go bin to PATH
        run: echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - name: Install wails3 CLI
        run: go install github.com/wailsapp/wails/v3/cmd/wails3@${{ env.WAILS_VERSION }}
      - name: Build linux amd64
        run: task linux:build DEV=false
      - name: Stage linux amd64 artifact
        run: |
          cp bin/GoldbusLight GoldbusLight-linux-amd64
          chmod +x GoldbusLight-linux-amd64
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: goldbus-linux-amd64
          path: GoldbusLight-linux-amd64

  build-linux-arm64:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - name: Install Linux GUI build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config \
            libgtk-4-dev libwebkitgtk-6.0-dev libglib2.0-dev libsoup-3.0-dev
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: ${{ env.GO_VERSION }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: arduino/setup-task@c0bc642852239c2689f73f4ea6459c29405f3c52 # v3.0.0
        with:
          version: 3.x
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Add Go bin to PATH
        run: echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - name: Install wails3 CLI
        run: go install github.com/wailsapp/wails/v3/cmd/wails3@${{ env.WAILS_VERSION }}
      - name: Build linux arm64 (Raspberry Pi OS 64-bit)
        run: task linux:build ARCH=arm64 DEV=false
      - name: Stage linux arm64 artifact
        run: |
          cp bin/GoldbusLight GoldbusLight-linux-arm64
          chmod +x GoldbusLight-linux-arm64
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: goldbus-linux-arm64
          path: GoldbusLight-linux-arm64

  build-windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_dispatch' && format('refs/tags/{0}', github.event.inputs.tag) || github.ref }}
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: ${{ env.GO_VERSION }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: arduino/setup-task@c0bc642852239c2689f73f4ea6459c29405f3c52 # v3.0.0
        with:
          version: 3.x
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Add Go bin to PATH
        run: echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - name: Install wails3 CLI
        run: go install github.com/wailsapp/wails/v3/cmd/wails3@${{ env.WAILS_VERSION }}
      - name: Build windows amd64
        run: task windows:build DEV=false
      - name: Stage windows artifact
        run: cp bin/GoldbusLight.exe GoldbusLight-windows-amd64.exe
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: goldbus-windows
          path: GoldbusLight-windows-amd64.exe
  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_dispatch' && format('refs/tags/{0}', github.event.inputs.tag) || github.ref }}
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: ${{ env.GO_VERSION }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: arduino/setup-task@c0bc642852239c2689f73f4ea6459c29405f3c52 # v3.0.0
        with:
          version: 3.x
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Add Go bin to PATH
        run: echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - name: Install wails3 CLI
        run: go install github.com/wailsapp/wails/v3/cmd/wails3@${{ env.WAILS_VERSION }}
      - name: Build darwin amd64
        run: task darwin:build ARCH=amd64 DEV=false OUTPUT=bin/GoldbusLight-darwin-amd64
      - name: Build darwin arm64
        run: task darwin:build ARCH=arm64 DEV=false OUTPUT=bin/GoldbusLight-darwin-arm64
      - name: Stage macOS artifacts
        run: |
          cp bin/GoldbusLight-darwin-amd64 GoldbusLight-darwin-amd64
          cp bin/GoldbusLight-darwin-arm64 GoldbusLight-darwin-arm64
          chmod +x GoldbusLight-darwin-amd64 GoldbusLight-darwin-arm64

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: goldbus-macos
          path: |
            GoldbusLight-darwin-amd64
            GoldbusLight-darwin-arm64

  release:
    needs: [ build-linux-amd64, build-linux-arm64, build-windows, build-macos ]
    runs-on: ubuntu-latest
    outputs:
      release_tag: ${{ steps.meta.outputs.tag }}
    steps:
      - name: Resolve release metadata
        id: meta
        run: |
          TAG="${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || github.ref_name }}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          path: dist
          pattern: goldbus-*
          merge-multiple: true

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: ${{ steps.meta.outputs.tag }}
          files: dist/*
          generate_release_notes: true
          body: |
            **Downloads:** choose the binary for your OS and CPU architecture.

            | Asset | Platform |
            |-------|----------|
            | `GoldbusLight-windows-amd64.exe` | Windows x64 |
            | `GoldbusLight-darwin-amd64` | macOS Intel |
            | `GoldbusLight-darwin-arm64` | macOS Apple silicon |
            | `GoldbusLight-linux-amd64` | Linux x64 |
            | `GoldbusLight-linux-arm64` | Linux arm64 (**Raspberry Pi OS 64-bit**, Pi 4 / Pi 5); built on a native arm64 GitHub runner |

            **Raspberry Pi:** use **64-bit** Raspberry Pi OS for `linux-arm64`. **32-bit** (`armv7` / `linux/arm`) is not built in CI.

            **Signing:** these binaries are **unsigned** (no Windows Authenticode / Apple notarization in CI).
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-update-manifest:
    needs: [ release ]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Fetch release payload
        id: release_json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.release.outputs.release_tag }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          payload="$(gh api "repos/$REPO/releases/tags/$TAG")"
          {
            echo "value<<EOF"
            echo "$payload"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.14"

      - name: Install MkDocs
        run: pip install -r requirements-docs.txt

      - name: Build stable update.json for GitHub Pages
        env:
          RELEASE_JSON: ${{ steps.release_json.outputs.value }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          mkdir -p pages/stable
          python3 - <<'PY'
          import datetime
          import hashlib
          import json
          import os
          import urllib.request

          release = json.loads(os.environ["RELEASE_JSON"])
          repo = os.environ["REPO"]
          tag = release["tag_name"]
          version = tag[1:] if tag.lower().startswith("v") else tag
          notes = release.get("body", "")
          release_date = release.get("published_at") or datetime.datetime.utcnow().strftime("%Y-%m-%dT%H:%M:%SZ")

          platform_map = {
              "GoldbusLight-linux-arm64": "linux-arm64",
              "GoldbusLight-linux-amd64": "linux-amd64",
              "GoldbusLight-darwin-arm64": "macos-arm64",
              "GoldbusLight-darwin-amd64": "macos-amd64",
              "GoldbusLight-windows-amd64.exe": "windows-amd64",
          }

          platforms = {}
          for asset in release.get("assets", []):
              name = asset.get("name", "")
              key = platform_map.get(name)
              if not key:
                  continue
              url = f"https://github.com/{repo}/releases/download/{tag}/{name}"
              with urllib.request.urlopen(url) as response:
                  data = response.read()
              sha = hashlib.sha256(data).hexdigest()
              platforms[key] = {
                  "url": url,
                  "size": asset.get("size", len(data)),
                  "checksum": f"sha256:{sha}",
              }

          manifest = {
              "version": version,
              "release_date": release_date,
              "release_notes": notes,
              "platforms": platforms,
              "mandatory": False,
          }

          with open("pages/stable/update.json", "w", encoding="utf-8") as f:
              json.dump(manifest, f, indent=2)
              f.write("\n")
          PY

      - name: Build documentation site into pages artifact
        run: |
          mkdocs build -d pages_docs
          rsync -a pages_docs/ pages/

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: pages

  deploy-pages:
    needs: [ build-update-manifest ]
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5