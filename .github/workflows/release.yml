  build-linux-arm64:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_dispatch' && format('refs/tags/{0}', github.event.inputs.tag) || github.ref }}

      - name: Install Linux GUI build dependencies (Wails CGO / wails3 CLI)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config \
            libgtk-3-dev libwebkit2gtk-4.1-dev

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - uses: arduino/setup-task@v2
        with:
          version: 3.x
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Add Go bin to PATH
        run: echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Install wails3 CLI
        run: go install github.com/wailsapp/wails/v3/cmd/wails3@${{ env.WAILS_VERSION }}

      - name: Build linux arm64 (Raspberry Pi OS 64-bit)
        run: task linux:build ARCH=arm64 DEV=false

      - name: Stage linux arm64 artifact
        run: |
          cp bin/GoldbusLight GoldbusLight-raspberrypi-arm64
          chmod +x GoldbusLight-raspberrypi-arm64

      - uses: actions/upload-artifact@v4
        with:
          name: goldbus-raspberrypi-arm64
          path: GoldbusLight-raspberrypi-arm64

