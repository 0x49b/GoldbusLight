<!DOCTYPE html>
<html lang="en" suppressHydrationWarning>
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/wails.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="/style.css" />
    <title>Wails + React + TS</title>
    <script>
      (function () {
        try {
          var themeKey = "goldbus-theme";
          var theme = localStorage.getItem(themeKey);
          if (theme === "system" || !theme) {
            theme = window.matchMedia("(prefers-color-scheme: dark)").matches
              ? "dark"
              : "light";
          }
          if (theme === "dark") {
            document.documentElement.classList.add("dark");
          } else {
            document.documentElement.classList.remove("dark");
          }

          var localeKey = "goldbus-locale";
          var pref = localStorage.getItem(localeKey);
          var lang = "en";
          if (pref === "en" || pref === "de") {
            lang = pref;
          } else {
            var languages = navigator.languages && navigator.languages.length
              ? navigator.languages
              : [navigator.language];
            for (var i = 0; i < languages.length; i++) {
              var normalized = String(languages[i] || "").trim().toLowerCase();
              if (normalized === "de" || normalized.indexOf("de-") === 0) {
                lang = "de";
                break;
              }
            }
          }
          document.documentElement.lang = lang;
        } catch (_) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
